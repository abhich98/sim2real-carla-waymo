[build-system]
requires = ["uv-build>=0.5.0,<0.11"]
build-backend = "uv_build"

[project]
name = "waymo-lidar-transformer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dask>=2026.7.1",
    "google>=3.0.0",
    "matplotlib>=3.10.5",
    "open3d>=0.19.0",
    "pyarrow>=25.0.0",
    "tensorflow>=2.21.0",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
]

[tool.uv.build-backend]
module-root = ""
module-name = ["src"]