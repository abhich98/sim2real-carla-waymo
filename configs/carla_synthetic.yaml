carla:
  host: 127.0.0.1
  port: 2000
  traffic_manager_port: 8000
  timeout_seconds: 30.0
  map_name: null

generation:
  num_frames: 10000
  frames_per_scene: 100
  seed: 42
  train_fraction: 0.8
  split_unit: scene
  # Capture always runs in CARLA synchronous mode so images and labels share a frame.
  fixed_delta_seconds: 0.1
  # Simulation ticks between saved frames; >1 reduces near-duplicate frames.
  ticks_per_frame: 1
  # Ticks discarded after each scene is set up (auto-exposure and walkers settle).
  warmup_ticks_per_scene: 20
  # Ego spawn points tried per scene before giving up (e.g. no sidewalk nearby).
  max_scene_attempts: 10

camera:
  width: 1280
  height: 720
  field_of_view_degrees: 90.0
  mount_x_meters: 1.5
  mount_y_meters: 0.0
  mount_z_meters: 1.7
  projection_near_plane_meters: 0.1

pedestrians:
  min_per_scene: 5
  max_per_scene: 15
  min_distance_meters: 5.0
  max_distance_meters: 45.0
  min_visible_fraction: 0.25
  min_box_area_pixels: 16.0
  front_spawn_cosine: 0.5
  spawn_attempts_per_pedestrian: 40
  min_walk_speed_meters_per_second: 0.8
  max_walk_speed_meters_per_second: 1.8

randomization:
  weather_presets:
    - ClearNoon
    - CloudyNoon
    - WetCloudySunset
  time_of_day_hours:
    - 8
    - 12
    - 17
  min_vehicles: 0
  max_vehicles: 12
  min_vehicle_distance_from_camera_meters: 8.0
  # Drive the camera vehicle / background traffic with the Traffic Manager.
  ego_autopilot: false
  background_vehicle_autopilot: true

occlusion:
  # CARLA semantic tag for pedestrians: 12 for CARLA >= 0.9.14, 4 for older builds.
  pedestrian_semantic_tag: 12
  # Depth slack around a pedestrian's 3D box when matching depth-camera pixels.
  depth_tolerance_meters: 1.0
  # A pedestrian is labelled only if this many of its pixels are visible...
  min_visible_pixels: 30
  # ...and they cover at least this fraction of its in-image projected box.
  min_visible_pixel_fraction: 0.1

labels:
  format: yolo
  pedestrian_class_id: 0
  pedestrian_class_name: pedestrian
  clip_boxes_to_image: true
  # segmentation: tight box around visible pedestrian pixels.
  # projected_3d: projected 3D bounding box (looser), still occlusion-filtered.
  box_source: segmentation

output:
  root: data/synthetic/carla_pedestrians
  image_format: png
